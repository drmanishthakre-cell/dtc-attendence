<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B6B52">
<title>DTC Attendance</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Tokens ===== */
:root {
  --bg: #EEF3F1;
  --surface: #FFFFFF;
  --ink: #17262E;
  --muted: #5A6A6F;
  --line: #D3DEDA;
  --go: #0B6B52;
  --go-soft: #CFE7DE;
  --warn: #A35F00;
  --warn-soft: #F6E6CC;
  --bad: #B42318;
  --bad-soft: #F7DAD7;
  --on-go: #FFFFFF;
  --radius-lg: 22px;
  --radius-sm: 10px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E181B; --surface: #16242A; --ink: #E4EDEA; --muted: #95A6A6; --line: #27383E;
    --go: #3DBE92; --go-soft: #173E33; --warn: #E3A34A; --warn-soft: #3A2C16; --bad: #F07468; --bad-soft: #3D1D1A; --on-go: #07211A;
  }
}
:root[data-theme="dark"] {
  --bg: #0E181B; --surface: #16242A; --ink: #E4EDEA; --muted: #95A6A6; --line: #27383E;
  --go: #3DBE92; --go-soft: #173E33; --warn: #E3A34A; --warn-soft: #3A2C16; --bad: #F07468; --bad-soft: #3D1D1A; --on-go: #07211A;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-size: 17px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--go); outline-offset: 2px; }
.wrap { max-width: 460px; margin: 0 auto; padding: 18px 18px 28px; }
.hidden { display: none !important; }

/* ===== Header ===== */
header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 6px; }
.place { font-weight: 700; font-size: 1.05rem; }
.who { color: var(--muted); font-size: .92rem; }
.who button { background: none; border: 0; padding: 0; color: var(--go); text-decoration: underline; cursor: pointer; font-size: .92rem; }
.clock { text-align: right; }
.clock b { display: block; font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.clock span { color: var(--muted); font-size: .85rem; }

/* ===== Radar (the one bold element) ===== */
.radar { position: relative; margin: 10px auto 4px; width: min(100%, 320px); aspect-ratio: 1; }
.radar svg { width: 100%; height: 100%; display: block; overflow: visible; }
.r-zone { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; transition: fill .4s, stroke .4s; }
.radar.inside .r-zone { fill: var(--go-soft); stroke: var(--go); stroke-width: 2.5; }
.radar.outside .r-zone { stroke: var(--warn); stroke-dasharray: 6 6; }
.r-grid { fill: none; stroke: var(--line); stroke-width: 1; }
.r-centre { fill: var(--ink); }
.r-acc { fill: var(--go); opacity: .14; }
.radar.outside .r-acc { fill: var(--warn); }
.r-me { fill: var(--go); stroke: var(--surface); stroke-width: 3; transition: cx .6s, cy .6s; }
.radar.outside .r-me { fill: var(--warn); }
.r-label { fill: var(--muted); font-size: 11px; font-family: inherit; }
.readout { position: absolute; left: 50%; bottom: 27%; transform: translateX(-50%); text-align: center; pointer-events: none; }
.readout b { font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.status { text-align: center; min-height: 3em; margin: 2px 6px 14px; color: var(--muted); }
.status strong { color: var(--ink); }

/* ===== Today ===== */
.today { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: 14px; }
.today div { padding: 10px 14px; }
.today div + div { border-left: 1px solid var(--line); }
.today small { display: block; color: var(--muted); font-size: .82rem; }
.today b { font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font-size: .78rem; padding: 1px 8px; border-radius: 99px; margin-left: 4px; vertical-align: 3px; }
.tag.ok { background: var(--go-soft); color: var(--go); }
.tag.late { background: var(--warn-soft); color: var(--warn); }

/* ===== Buttons ===== */
.punch { width: 100%; min-height: 64px; border: 0; border-radius: var(--radius-lg); background: var(--go); color: var(--on-go); font-size: 1.25rem; font-weight: 700; cursor: pointer; }
.punch:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
.btn { min-height: 48px; padding: 0 18px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; }
.btn.primary { background: var(--go); border-color: var(--go); color: var(--on-go); }
.pending { margin: 12px 0 0; padding: 10px 14px; border-radius: var(--radius-sm); background: var(--warn-soft); color: var(--warn); font-size: .92rem; }
footer { margin-top: 26px; text-align: center; font-size: .85rem; color: var(--muted); }
footer button { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: .85rem; padding: 8px; }

/* ===== Staff picker ===== */
.pick h1 { font-size: 1.6rem; margin: 18px 0 4px; }
.pick p { color: var(--muted); margin: 0 0 18px; }
.names { display: grid; gap: 10px; }
.names button { text-align: left; min-height: 56px; padding: 0 18px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface); font-size: 1.1rem; cursor: pointer; }

/* ===== Dialog ===== */
dialog { border: 0; border-radius: var(--radius-lg); padding: 22px; width: min(92vw, 380px); background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(10, 20, 24, .55); }
dialog h2 { margin: 0 0 4px; font-size: 1.3rem; }
dialog p { margin: 0 0 14px; color: var(--muted); }
.pin { width: 100%; font-size: 1.8rem; letter-spacing: .4em; text-align: center; padding: 10px; border-radius: var(--radius-sm); border: 1.5px solid var(--line); background: var(--bg); }
.row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
.err { color: var(--bad); min-height: 1.4em; margin-top: 8px; font-size: .92rem; }

/* ===== Toast ===== */
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, calc(100% + 60px)); visibility: hidden; width: min(92vw, 420px); padding: 14px 16px; border-radius: var(--radius-sm); background: var(--ink); color: var(--bg); transition: transform .3s, visibility .3s; z-index: 10; }
.toast.show { transform: translate(-50%, 0); visibility: visible; }
.toast.bad { background: var(--bad); color: #fff; }
.toast.good { background: var(--go); color: var(--on-go); }

.setup-note { background: var(--warn-soft); color: var(--warn); padding: 14px; border-radius: var(--radius-sm); margin-top: 16px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <!-- Staff picker -->
  <section id="pickScreen" class="pick hidden">
    <h1 id="pickTitle">Who uses this phone?</h1>
    <p>Choose your name once. You'll enter your PIN at every check-in.</p>
    <div class="names" id="names"></div>
  </section>

  <!-- Main -->
  <section id="mainScreen" class="hidden">
    <header>
      <div>
        <div class="place" id="dtcName">DTC</div>
        <div class="who"><span id="myName"></span> <button id="changeMe" type="button">Change</button></div>
      </div>
      <div class="clock"><b id="clock">--:--</b><span id="dateLine"></span></div>
    </header>

    <div class="radar" id="radar" aria-hidden="true">
      <svg viewBox="0 0 240 240">
        <circle class="r-grid" cx="120" cy="120" r="114"/>
        <circle class="r-zone" cx="120" cy="120" r="76"/>
        <circle class="r-grid" cx="120" cy="120" r="38"/>
        <line class="r-grid" x1="120" y1="8" x2="120" y2="232"/>
        <line class="r-grid" x1="8" y1="120" x2="232" y2="120"/>
        <text class="r-label" x="124" y="40" id="ringLabel">100 m</text>
        <text class="r-label" x="116" y="18" text-anchor="end">N</text>
        <rect class="r-centre" x="115" y="115" width="10" height="10" rx="2"/>
        <circle class="r-acc" id="acc" cx="120" cy="120" r="0"/>
        <circle class="r-me hidden" id="me" cx="120" cy="120" r="8"/>
      </svg>
      <div class="readout"><b id="dist">—</b></div>
    </div>
    <p class="status" id="status" role="status" aria-live="polite">Finding your location…</p>

    <div class="today">
      <div><small>Check in</small><b id="tIn">—</b><span id="tInTag"></span></div>
      <div><small>Check out</small><b id="tOut">—</b><span id="tOutTag"></span></div>
    </div>

    <button class="punch" id="punchBtn" type="button" disabled>Check in</button>
    <div class="pending hidden" id="pending"></div>
    <div class="setup-note hidden" id="setupNote"></div>

    <footer>
      Time is recorded by the server, not this phone.<br>
      <button id="adminBtn" type="button">Set DTC location (admin)</button>
    </footer>
  </section>
</div>

<dialog id="pinDlg">
  <h2 id="pinTitle">Check in</h2>
  <p id="pinSub">Enter your PIN</p>
  <input class="pin" id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" aria-label="PIN">
  <div class="err" id="pinErr"></div>
  <div class="row">
    <button class="btn" type="button" id="pinCancel">Cancel</button>
    <button class="btn primary" type="button" id="pinOk">Check in</button>
  </div>
</dialog>

<div class="toast" id="toast" role="alert"></div>

<script>
/* ======= SET THIS: your Apps Script Web App URL ======= */
const API_URL = 'https://script.google.com/macros/s/AKfycbzcb7aDvF8kKnOUe-q7rxFpo5OqgibpZNWE36hwc5Q5Gi0IH4a_d5jFPI-h_MkCyjqWvQ/exec';
/* ===================================================== */

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

let cfg = store.get('cfg', null);
let me = store.get('me', null);
let fix = null;          // latest GPS {lat,lng,acc,at}
let today = null;        // {checkIn,inStatus,checkOut,outStatus}
let pinMode = null;      // 'IN' | 'OUT' | 'ADMIN'

/* ---------- API ---------- */
async function apiGet(params) {
  const r = await fetch(API_URL + '?' + new URLSearchParams(params), { cache: 'no-store' });
  return r.json();
}
async function apiPost(body) {
  // text/plain body avoids a CORS preflight with Apps Script
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
  return r.json();
}

/* ---------- Geo math ---------- */
function haversine(a, b, c, d) {
  const R = 6371000, r = Math.PI / 180, dLa = (c - a) * r, dLo = (d - b) * r;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function bearing(a, b, c, d) { // from DTC (a,b) to me (c,d)
  const r = Math.PI / 180, y = Math.sin((d - b) * r) * Math.cos(c * r);
  const x = Math.cos(a * r) * Math.sin(c * r) - Math.sin(a * r) * Math.cos(c * r) * Math.cos((d - b) * r);
  return Math.atan2(y, x);
}

/* ---------- Screens ---------- */
function showPicker() {
  $('mainScreen').classList.add('hidden');
  $('pickScreen').classList.remove('hidden');
  const box = $('names'); box.innerHTML = '';
  if (!cfg || !cfg.staff || !cfg.staff.length) {
    box.innerHTML = '<p>Staff list not loaded. Connect to the internet and reopen the app.</p>';
    return;
  }
  cfg.staff.forEach(n => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = n;
    b.onclick = () => { me = n; store.set('me', n); showMain(); };
    box.appendChild(b);
  });
}
function showMain() {
  $('pickScreen').classList.add('hidden');
  $('mainScreen').classList.remove('hidden');
  $('myName').textContent = me;
  $('dtcName').textContent = cfg ? cfg.dtcName : 'DTC';
  today = store.get('today:' + me + ':' + ymd(new Date()), null);
  loadToday();
  render();
}

/* ---------- Data loading ---------- */
async function loadConfig() {
  if (API_URL.startsWith('PASTE')) {
    $('setupNote').textContent = 'Setup needed: paste your Apps Script Web App URL into index.html (API_URL).';
    $('setupNote').classList.remove('hidden');
  }
  try {
    const c = await apiGet({ action: 'config' });
    if (c.ok) { cfg = c; store.set('cfg', c); }
  } catch (e) { /* offline: use cached cfg */ }
}
async function loadToday() {
  if (!me) return;
  try {
    const r = await apiGet({ action: 'today', staff: me });
    if (r.ok) { today = r.today; store.set('today:' + me + ':' + ymd(new Date()), today); render(); }
  } catch (e) {}
}

/* ---------- GPS ---------- */
function startGps() {
  if (!('geolocation' in navigator)) { setStatus('This phone does not support location.'); return; }
  navigator.geolocation.watchPosition(p => {
    fix = { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy), at: Date.now() };
    render();
  }, err => {
    if (err.code === 1) setStatus('<strong>Location is blocked.</strong> Allow location for this app in phone settings, then reopen it.');
    else setStatus('Waiting for GPS. Move near a window or step outside.');
  }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 });
}
function setStatus(html) { $('status').innerHTML = html; }

/* ---------- Render ---------- */
function geoState() {
  if (!cfg) return { ok: false, msg: 'Connect to the internet once to load settings.' };
  if (cfg.lat == null) return { ok: false, msg: '<strong>DTC location not set.</strong> Admin: stand at the DTC and use the link below.' };
  if (!fix) return { ok: false, msg: 'Finding your location…' };
  const d = Math.round(haversine(cfg.lat, cfg.lng, fix.lat, fix.lng));
  const stale = Date.now() - fix.at > 60000;
  if (stale) return { ok: false, d, msg: 'Location is out of date. Waiting for a fresh GPS fix…' };
  if (fix.acc > cfg.maxAcc) return { ok: false, d, msg: 'GPS is imprecise (±' + fix.acc + ' m). Move near a window or step outside.' };
  if (d > cfg.radius) return { ok: false, d, out: true, msg: '<strong>Outside the DTC boundary.</strong> Come within ' + cfg.radius + ' m to check in.' };
  return { ok: true, d, msg: '<strong>Inside the DTC boundary.</strong> GPS accurate to ±' + fix.acc + ' m.' };
}

function render() {
  const g = geoState();
  setStatus(g.msg);
  const radar = $('radar');
  radar.classList.toggle('inside', g.ok);
  radar.classList.toggle('outside', !!g.out);
  $('ringLabel').textContent = (cfg ? cfg.radius : 100) + ' m';
  $('dist').textContent = g.d != null ? g.d + ' m' : '—';

  const meDot = $('me'), acc = $('acc');
  if (cfg && cfg.lat != null && fix) {
    const R = 76, scale = R / cfg.radius;
    const d = haversine(cfg.lat, cfg.lng, fix.lat, fix.lng);
    const px = Math.min(d * scale, 110);
    const b = bearing(cfg.lat, cfg.lng, fix.lat, fix.lng);
    const x = 120 + px * Math.sin(b), y = 120 - px * Math.cos(b);
    meDot.setAttribute('cx', x.toFixed(1)); meDot.setAttribute('cy', y.toFixed(1));
    acc.setAttribute('cx', x.toFixed(1)); acc.setAttribute('cy', y.toFixed(1));
    acc.setAttribute('r', Math.min(fix.acc * scale, 60).toFixed(1));
    meDot.classList.remove('hidden');
  } else { meDot.classList.add('hidden'); acc.setAttribute('r', 0); }

  const t = today || {};
  $('tIn').textContent = t.checkIn || '—';
  $('tOut').textContent = t.checkOut || '—';
  $('tInTag').innerHTML = tag(t.inStatus);
  $('tOutTag').innerHTML = tag(t.outStatus);

  const btn = $('punchBtn');
  if (t.checkIn && t.checkOut) { btn.textContent = 'Done for today'; btn.disabled = true; }
  else {
    btn.textContent = t.checkIn ? 'Check out' : 'Check in';
    btn.disabled = !g.ok;
  }
  renderPending();
}
function tag(s) {
  if (!s) return '';
  const ok = /On time|Completed/.test(s);
  const label = s.replace(/\s*\(.*\)/, '');
  return '<span class="tag ' + (ok ? 'ok' : 'late') + '">' + label + '</span>';
}
function renderPending() {
  const q = store.get('queue', []);
  const el = $('pending');
  if (q.length) { el.textContent = q.length + (q.length === 1 ? ' entry is' : ' entries are') + ' saved on this phone and will sync when online.'; el.classList.remove('hidden'); }
  else el.classList.add('hidden');
}
function tickClock() {
  const d = new Date();
  $('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
  $('dateLine').textContent = d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg, kind) {
  const t = $('toast');
  t.textContent = msg; t.className = 'toast show ' + (kind || '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = 'toast', 4500);
}

/* ---------- PIN dialog ---------- */
function openPin(mode) {
  pinMode = mode;
  $('pinErr').textContent = ''; $('pinInput').value = '';
  if (mode === 'ADMIN') {
    $('pinTitle').textContent = 'Set DTC location';
    $('pinSub').textContent = 'Stand at the centre of the DTC. Your current GPS position will be saved as the DTC.' + (fix ? ' Accuracy now: ±' + fix.acc + ' m.' : '');
    $('pinOk').textContent = 'Save location';
  } else {
    const word = mode === 'IN' ? 'Check in' : 'Check out';
    $('pinTitle').textContent = word;
    $('pinSub').textContent = me + ', enter your PIN';
    $('pinOk').textContent = word;
  }
  $('pinDlg').showModal();
  setTimeout(() => $('pinInput').focus(), 50);
}

async function confirmPin() {
  const pin = $('pinInput').value.trim();
  if (!pin) { $('pinErr').textContent = 'Enter your PIN.'; return; }
  if (!fix) { $('pinErr').textContent = 'No GPS fix yet.'; return; }
  const ok = $('pinOk'); ok.disabled = true;

  if (pinMode === 'ADMIN') {
    try {
      const r = await apiPost({ action: 'setLocation', adminPin: pin, lat: fix.lat, lng: fix.lng, acc: fix.acc });
      if (!r.ok) { $('pinErr').textContent = r.message; }
      else { $('pinDlg').close(); toast(r.message, 'good'); await loadConfig(); render(); }
    } catch (e) { $('pinErr').textContent = 'No internet. Setting the location needs a connection.'; }
    ok.disabled = false; return;
  }

  const body = { action: 'punch', staff: me, pin, type: pinMode, lat: fix.lat, lng: fix.lng, acc: fix.acc, deviceTime: new Date().toISOString() };
  try {
    const r = await apiPost(body);
    if (!r.ok) { $('pinErr').textContent = r.message; ok.disabled = false; return; }
    $('pinDlg').close();
    if (r.today) { today = r.today; store.set('today:' + me + ':' + ymd(new Date()), today); }
    toast(r.already ? r.message : (r.type === 'IN' ? 'Checked in' : 'Checked out') + ' at ' + r.time + '. ' + r.status + '.', r.already ? '' : 'good');
  } catch (e) {
    // Offline: queue it, flagged on the server when synced
    const q = store.get('queue', []); body.offline = true; q.push(body); store.set('queue', q);
    const hhmm = pad(new Date().getHours()) + ':' + pad(new Date().getMinutes());
    today = Object.assign({}, today || {});
    if (pinMode === 'IN') { today.checkIn = hhmm; today.inStatus = 'Pending sync'; }
    else { today.checkOut = hhmm; today.outStatus = 'Pending sync'; }
    store.set('today:' + me + ':' + ymd(new Date()), today);
    $('pinDlg').close();
    toast('No internet. Saved on this phone; it will sync automatically.', '');
  }
  ok.disabled = false; render();
}

/* ---------- Offline sync ---------- */
let syncing = false;
async function syncQueue() {
  if (syncing || !navigator.onLine) return;
  let q = store.get('queue', []);
  if (!q.length) return;
  syncing = true;
  const keep = [];
  for (const item of q) {
    try {
      const r = await apiPost(item);
      if (!r.ok) toast('A saved entry was rejected: ' + r.message, 'bad');
      else if (r.today && item.staff === me) { today = r.today; store.set('today:' + me + ':' + ymd(new Date()), today); }
    } catch (e) { keep.push(item); }
  }
  store.set('queue', keep);
  syncing = false;
  if (keep.length < q.length) toast('Saved entries synced.', 'good');
  render();
}

/* ---------- Events ---------- */
$('punchBtn').onclick = () => openPin(today && today.checkIn ? 'OUT' : 'IN');
$('pinOk').onclick = confirmPin;
$('pinCancel').onclick = () => $('pinDlg').close();
$('pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') confirmPin(); });
$('adminBtn').onclick = () => openPin('ADMIN');
$('changeMe').onclick = () => { if (confirm('Change the staff member for this phone?')) { me = null; store.set('me', null); showPicker(); } };
window.addEventListener('online', syncQueue);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { loadToday(); syncQueue(); } });

/* ---------- Start ---------- */
(async function init() {
  tickClock(); setInterval(tickClock, 10000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  await loadConfig();
  if (me && cfg && cfg.staff && !cfg.staff.includes(me)) { me = null; store.set('me', null); }
  if (me) showMain(); else showPicker();
  startGps();
  syncQueue(); setInterval(syncQueue, 60000);
  setInterval(render, 15000);
})();
</script>
</body>
</html>
